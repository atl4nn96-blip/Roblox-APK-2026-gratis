<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Archivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 15px; }
        .boton-descarga {
            background: #ffeb3b;
            color: black;
            padding: 18px 35px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .boton-descarga:hover { transform: scale(1.05); background: #fdd835; }
        p { margin-top: 25px; font-size: 1rem; opacity: 0.8; }
    </style>
</head>
<body>
    <h1>Descargar Archivo</h1>
    <button class="boton-descarga" id="btnDescargar">Descargar ahora</button>
    <p>Al presionar se guardará automáticamente</p>

    <script>
        // Evita que se agregue el evento varias veces
        const boton = document.getElementById('btnDescargar');
        boton.replaceWith(boton.cloneNode(true));
        const nuevoBoton = document.getElementById('btnDescargar');

        const contenidoArchivo = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>free coins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; }
        .pantalla-inicio { background-color: black; color: white; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
        .texto-inicio { font-size: 2.8rem; font-weight: bold; text-align: center; line-height: 1.3; }
        .boton-amarillo { background-color: #ffeb3b; color: black; border: none; padding: 22px 35px; font-size: 1.8rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: transform 0.2s; width: 90%; max-width: 450px; }
        .boton-amarillo:hover { transform: scale(1.05); }
        .pantalla-blanca { background-color: white; width: 100%; height: 100%; display: none; }
        .pantalla-azul { background-color: #0078d7; color: white; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: flex-start; padding: 40px 30px; gap: 50px; }
        .texto-azul { font-size: 2rem; line-height: 1.5; font-weight: normal; }
        .boton-azul { background-color: white; color: #0078d7; border: none; padding: 15px 30px; font-size: 1.4rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
        .boton-azul:hover { transform: scale(1.05); background-color: #f0f0f0; }
    </style>
</head>
<body>
    <div id="inicio" class="pantalla-inicio">
        <h1 class="texto-inicio">free coins click now !</h1>
        <button class="boton-amarillo" id="botonCoins">free coins $ $ $</button>
    </div>
    <div id="blanca" class="pantalla-blanca"></div>
    <div id="azul" class="pantalla-azul">
        <p class="texto-azul">:( lo sentimos pero su dispositivo ha sido hackeado<br>por favor presione reiniciar</p>
        <button class="boton-azul" id="botonReiniciar">reiniciar</button>
    </div>
    <script>
        document.getElementById('botonCoins').addEventListener('click', () => {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('blanca').style.display = 'block';
            if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
            const audio = new AudioContext();
            const oscilador = audio.createOscillator();
            const ganancia = audio.createGain();
            oscilador.connect(ganancia);
            ganancia.connect(audio.destination);
            oscilador.type = 'sawtooth';
            oscilador.frequency.setValueAtTime(180, audio.currentTime);
            oscilador.frequency.exponentialRampToValueAtTime(25, audio.currentTime + 1.2);
            ganancia.gain.setValueAtTime(0.6, audio.currentTime);
            ganancia.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 1.2);
            oscilador.start();
            oscilador.stop(audio.currentTime + 1.2);
            setTimeout(() => { document.getElementById('blanca').style.display = 'none'; document.getElementById('azul').style.display = 'flex'; }, 3000);
        });
        document.getElementById('botonReiniciar').addEventListener('click', () => {
            document.getElementById('azul').style.display = 'none'; document.getElementById('blanca').style.display = 'none'; document.getElementById('inicio').style.display = 'flex';
        });
    <\/script>
</body>
</html>`;

        nuevoBoton.addEventListener('click', () => {
            const blob = new Blob([contenidoArchivo], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'www.freecoins.com.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
        </html>
